version: '3.8'

services:
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: patent_classification_opensearch
    environment:
      - cluster.name=patent-classification-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - "OPENSEARCH_JAVA_OPTS=-Xms1536m -Xmx1536m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - patent-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: patent_classification_dashboards
    ports:
      - "5601:5601"
    expose:
      - "5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - patent-network
    depends_on:
      opensearch:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patent_classification_api
    ports:
      - "8000:8000"
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
    volumes:
      - ./data_20250812:/app/data_20250812:ro
      - ./models:/app/models
      - ./import_classification_data.py:/app/import_classification_data.py:ro
      - ./patent_classification_api.py:/app/patent_classification_api.py:ro
    networks:
      - patent-network
    depends_on:
      opensearch:
        condition: service_healthy
    command: uvicorn patent_classification_api:app --host 0.0.0.0 --port 8000 --reload

volumes:
  opensearch-data:

networks:
  patent-network:
    driver: bridge
