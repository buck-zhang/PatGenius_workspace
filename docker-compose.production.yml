# PatGenius 本番環境用 Docker Compose
version: '3.8'

services:
  # OpenSearch データベース
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: patgenius-opensearch
    environment:
      - cluster.name=patgenius-cluster
      - node.name=patgenius-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - patgenius-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # OpenSearch Dashboards (オプション)
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: patgenius-dashboards
    ports:
      - "5601:5601"
    expose:
      - "5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    volumes:
      - ./config/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - patgenius-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # PatGenius FastAPI サービス
  patgenius-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patgenius-api
    ports:
      - "8000:8000"
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - INDEX_NAME=patents
      - PYTHONUNBUFFERED=1
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - patgenius-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # データインポートサービス (一回限りの実行)
  patgenius-importer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patgenius-importer
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - INDEX_NAME=patents
      - PYTHONUNBUFFERED=1
    volumes:
      - ./source_data:/app/source_data:ro
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - patgenius-network
    command: ["python", "bulk_import_patents.py"]
    restart: "no"
    profiles:
      - import  # docker-compose --profile import up で実行

  # Nginx リバースプロキシ (本番環境用)
  nginx:
    image: nginx:alpine
    container_name: patgenius-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL証明書用 (オプション)
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - patgenius-api
      - opensearch-dashboards
    networks:
      - patgenius-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  opensearch-data:
    driver: local

networks:
  patgenius-network:
    driver: bridge