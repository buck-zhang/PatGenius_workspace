<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 高度特許分類検索システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .search-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .search-form {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .search-input {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .search-btn {
            padding: 15px 30px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .examples {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .example-btn {
            padding: 12px 18px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            text-align: left;
        }
        
        .example-btn:hover {
            background: #e9ecef;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .example-advanced {
            background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
            border-color: #81c784;
        }
        
        .results-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 8px;
        }
        
        .result-count {
            font-size: 1.3rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .search-time {
            color: #666;
            font-size: 0.9rem;
        }
        
        .result-item {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s;
            cursor: pointer;
            background: linear-gradient(135deg, #ffffff, #f8f9fa);
        }
        
        .result-item:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transform: translateY(-2px);
            border-color: #667eea;
        }
        
        .result-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .system-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
        }
        
        .system-ipc { background: linear-gradient(135deg, #4299e1, #3182ce); }
        .system-fi { background: linear-gradient(135deg, #48bb78, #38a169); }
        .system-cpc { background: linear-gradient(135deg, #ed8936, #dd6b20); }
        
        .code {
            font-family: 'Courier New', monospace;
            background: #f7fafc;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid #e2e8f0;
        }
        
        .doc-count {
            color: #718096;
            font-size: 14px;
            background: #edf2f7;
            padding: 4px 8px;
            border-radius: 4px;
        }
        
        .score-badge {
            background: linear-gradient(135deg, #fbb6ce, #f687b3);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .result-titles {
            margin-bottom: 15px;
        }
        
        .title-ja {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 8px;
            line-height: 1.5;
        }
        
        .title-en {
            color: #4a5568;
            font-style: italic;
            font-size: 14px;
            line-height: 1.4;
        }
        
        mark {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
            color: #744210;
        }
        
        .hierarchy-section {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .hierarchy-path {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .hierarchy-item {
            background: #e2e8f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
        }
        
        .hierarchy-arrow {
            color: #667eea;
            font-weight: bold;
        }
        
        .child-classifications {
            margin-top: 10px;
        }
        
        .child-title {
            font-size: 13px;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 8px;
        }
        
        .child-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .child-item {
            background: #e6fffa;
            border: 1px solid #81e6d9;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
            color: #234e52;
        }
        
        .action-buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .detail-btn {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
        }
        
        .hierarchy-btn {
            background: linear-gradient(135deg, #4299e1, #3182ce);
            color: white;
        }
        
        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #667eea;
            font-size: 18px;
        }
        
        .error {
            background: linear-gradient(135deg, #fed7d7, #feb2b2);
            color: #c53030;
            border: 1px solid #fc8181;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .help-section {
            background: linear-gradient(135deg, #f0fff4, #e6fffa);
            border: 1px solid #81e6d9;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .help-title {
            font-size: 16px;
            font-weight: bold;
            color: #234e52;
            margin-bottom: 12px;
        }
        
        .help-content {
            font-size: 14px;
            color: #2d3748;
            line-height: 1.6;
        }
        
        .highlight-demo {
            background: #fff5f5;
            border: 1px solid #fed7d7;
            border-radius: 6px;
            padding: 10px;
            margin: 10px 0;
            font-size: 13px;
        }
        
        @media (max-width: 768px) {
            .search-form {
                grid-template-columns: 1fr;
            }
            
            .results-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .result-header {
                flex-wrap: wrap;
            }
            
            .hierarchy-path {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 高度特許分類検索システム</h1>
            <p>527,617件の分類データから高精度検索 | キーワードハイライト対応</p>
        </div>
        
        <div class="search-section">
            <h2>💎 キーワード検索</h2>
            
            <div class="search-form">
                <input type="text" class="search-input" id="keywordInput" 
                       placeholder="検索キーワードを入力（例：画像形成装置、画像 AND 形成）">
                <button class="search-btn" onclick="performSearch()">🔍 分類検索</button>
            </div>
            
            <div class="examples">
                <h4 style="grid-column: 1/-1; margin: 10px 0;">🌟 シンプル検索例</h4>
                <button class="example-btn" onclick="setExample('画像形成装置')">
                    📄 画像形成装置<br><small>複写機・プリンター関連</small>
                </button>
                <button class="example-btn" onclick="setExample('現像剤')">
                    🧪 現像剤<br><small>電子写真プロセス</small>
                </button>
                <button class="example-btn" onclick="setExample('センサ')">
                    📡 センサ<br><small>検出・制御技術</small>
                </button>
                <button class="example-btn" onclick="setExample('電子写真')">
                    ⚡ 電子写真<br><small>感光体・現像技術</small>
                </button>
                
                <h4 style="grid-column: 1/-1; margin: 20px 0 10px 0;">🚀 高度検索例</h4>
                <button class="example-btn example-advanced" onclick="setExample('画像 AND 形成')">
                    🔗 AND検索: 画像 AND 形成<br><small>両方のキーワードを含む分類</small>
                </button>
                <button class="example-btn example-advanced" onclick="setExample('トナー OR 現像剤')">
                    🌐 OR検索: トナー OR 現像剤<br><small>どちらかのキーワードを含む分類</small>
                </button>
                <button class="example-btn example-advanced" onclick="setExample('車 NEAR3 両')">
                    📍 NEAR検索: 車 NEAR3 両<br><small>車と両が3語以内の距離</small>
                </button>
                <button class="example-btn example-advanced" onclick="setExample('レーザー NOT プリンター')">
                    🚫 NOT検索: レーザー NOT プリンター<br><small>レーザーを含むがプリンターを含まない</small>
                </button>
            </div>
            
            <div class="help-section">
                <div class="help-title">💡 検索精度向上機能</div>
                <div class="help-content">
                    <strong>🎯 キーワードハイライト:</strong> 検索キーワードが分類タイトル内で<mark>黄色ハイライト</mark>表示されます<br>
                    <strong>📊 スコア表示:</strong> マッチの関連度がスコアで表示されます<br>
                    <strong>🌲 階層表示:</strong> 上位・下位分類が視覚的に表示されます<br>
                    <strong>📈 詳細情報:</strong> 文書数、テーマ、対応関係なども表示
                </div>
                <div class="highlight-demo">
                    <strong>例:</strong> 「画像 AND 形成」検索 → 「さらに材料の<mark>画像</mark>を<mark>形成</mark>するもの」
                </div>
            </div>
        </div>
        
        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <div class="result-count" id="resultCount">検索結果</div>
                <div class="search-time" id="searchTime">検索時間: -</div>
            </div>
            <div id="resultsContainer"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001';
        
        // 検索例を設定
        function setExample(keyword) {
            document.getElementById('keywordInput').value = keyword;
        }
        
        // エンターキーで検索
        document.getElementById('keywordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
        
        // 検索実行
        async function performSearch() {
            const query = document.getElementById('keywordInput').value.trim();
            
            if (!query) {
                alert('検索キーワードを入力してください');
                return;
            }
            
            const resultsSection = document.getElementById('resultsSection');
            const resultsContainer = document.getElementById('resultsContainer');
            const searchBtn = document.querySelector('.search-btn');
            
            // ローディング表示
            resultsSection.style.display = 'block';
            resultsContainer.innerHTML = '<div class="loading">🔍 高精度検索中...</div>';
            searchBtn.disabled = true;
            searchBtn.textContent = '🔍 検索中...';
            
            try {
                const startTime = Date.now();
                const response = await fetch(`${API_BASE}/search/keyword`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        keyword: query,
                        systems: ['IPC', 'FI', 'CPC'],
                        limit: 10,
                        highlight: true
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                const endTime = Date.now();
                
                // 結果表示
                displayResults(data, endTime - startTime);
                
            } catch (error) {
                console.error('検索エラー:', error);
                resultsContainer.innerHTML = `
                    <div class="error">
                        ❌ 検索エラー: ${error.message}<br>
                        APIサーバーが起動していることを確認してください。
                    </div>
                `;
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = '🔍 分類検索';
            }
        }
        
        // 結果表示
        function displayResults(data, clientTime) {
            const resultsContainer = document.getElementById('resultsContainer');
            const resultCount = document.getElementById('resultCount');
            const searchTime = document.getElementById('searchTime');
            
            resultCount.textContent = `検索結果: ${data.total.toLocaleString()}件`;
            searchTime.textContent = `検索時間: ${data.query_info.execution_time_ms}ms (通信: ${clientTime}ms)`;
            
            if (data.results.length === 0) {
                resultsContainer.innerHTML = '<div class="error">📭 検索結果が見つかりませんでした。別のキーワードで検索してみてください。</div>';
                return;
            }
            
            const resultsHtml = data.results.map((item, index) => {
                const systemClass = `system-${item.classification_system.toLowerCase()}`;
                
                // ハイライト表示用のタイトル
                const titleJa = item.title_ja_highlighted || item.title_ja || 'N/A';
                const titleEn = item.title_en_highlighted || item.title_en || 'N/A';
                
                // 階層パス表示
                let hierarchyPathHtml = '';
                if (item.hierarchy_path && item.hierarchy_path.length > 0) {
                    const pathItems = item.hierarchy_path.map(h => 
                        `<span class="hierarchy-item">${h.code}</span>`
                    ).join('<span class="hierarchy-arrow">→</span>');
                    hierarchyPathHtml = `
                        <div class="hierarchy-section">
                            <div class="child-title">🌲 階層パス:</div>
                            <div class="hierarchy-path">${pathItems}</div>
                        </div>
                    `;
                }
                
                // 下位分類表示
                let childrenHtml = '';
                if (item.child_classifications && item.child_classifications.length > 0) {
                    const childItems = item.child_classifications.slice(0, 8).map(c => 
                        `<span class="child-item">${c.code}</span>`
                    ).join('');
                    const moreCount = item.total_children > 8 ? `<span class="child-item">+${item.total_children - 8}件</span>` : '';
                    childrenHtml = `
                        <div class="child-classifications">
                            <div class="child-title">📋 下位分類 (${item.total_children}件):</div>
                            <div class="child-list">${childItems}${moreCount}</div>
                        </div>
                    `;
                }
                
                return `
                    <div class="result-item">
                        <div class="result-header">
                            <span class="system-badge ${systemClass}">${item.classification_system}</span>
                            <span class="code">${item.code}</span>
                            <span class="doc-count">📄 ${item.num_documents.toLocaleString()}件</span>
                            <span class="score-badge">⭐ ${(item.match_score || 0).toFixed(2)}</span>
                        </div>
                        
                        <div class="result-titles">
                            <div class="title-ja">${titleJa}</div>
                            <div class="title-en">${titleEn}</div>
                        </div>
                        
                        ${hierarchyPathHtml}
                        ${childrenHtml}
                        
                        <div class="action-buttons">
                            <button class="action-btn detail-btn" onclick="getClassificationDetails('${item.classification_system}', '${item.code}')">
                                📋 詳細表示
                            </button>
                            <button class="action-btn hierarchy-btn" onclick="getHierarchy('${item.classification_system}', '${item.code}')">
                                🌲 階層表示
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
            
            resultsContainer.innerHTML = resultsHtml;
        }
        
        // 分類詳細表示
        async function getClassificationDetails(system, code) {
            try {
                const response = await fetch(`${API_BASE}/classification/${system}/${encodeURIComponent(code)}`);
                if (response.ok) {
                    const data = await response.json();
                    
                    let details = `📋 分類詳細情報\\n\\n`;
                    details += `🏷️ システム: ${data.classification_system}\\n`;
                    details += `🔢 コード: ${data.code}\\n`;
                    details += `📊 レベル: ${data.level}\\n`;
                    details += `📄 文書数: ${data.num_documents.toLocaleString()}件\\n\\n`;
                    details += `🇯🇵 日本語: ${data.title_ja || '（なし）'}\\n\\n`;
                    details += `🇺🇸 英語: ${data.title_en || '（なし）'}\\n`;
                    
                    if (data.theme) details += `\\n🎯 テーマ: ${data.theme}`;
                    if (data.concordance) details += `\\n🔗 対応関係: ${data.concordance}`;
                    
                    alert(details);
                } else {
                    alert('分類詳細の取得に失敗しました');
                }
            } catch (error) {
                alert('分類詳細の取得でエラーが発生しました: ' + error.message);
            }
        }
        
        // 階層表示
        async function getHierarchy(system, code) {
            try {
                const response = await fetch(`${API_BASE}/hierarchy/${system}/${encodeURIComponent(code)}?include_parents=true&include_children=true`);
                if (response.ok) {
                    const data = await response.json();
                    
                    let hierarchy = `🌲 階層情報 - ${code} (${system})\\n\\n`;
                    
                    if (data.parents && data.parents.length > 0) {
                        hierarchy += "⬆️ 上位分類:\\n";
                        data.parents.forEach(parent => {
                            hierarchy += `  📁 ${parent.code}: ${parent.title_ja || parent.title_en}\\n`;
                        });
                        hierarchy += "\\n";
                    }
                    
                    if (data.current) {
                        hierarchy += `📍 現在の分類:\\n  🎯 ${data.current.code}: ${data.current.title_ja || data.current.title_en}\\n\\n`;
                    }
                    
                    if (data.children && data.children.length > 0) {
                        hierarchy += "⬇️ 下位分類:\\n";
                        data.children.slice(0, 15).forEach(child => {
                            hierarchy += `  📋 ${child.code}: ${child.title_ja || child.title_en}\\n`;
                        });
                        if (data.children.length > 15) {
                            hierarchy += `  ➕ ... 他 ${data.children.length - 15} 件\\n`;
                        }
                    }
                    
                    alert(hierarchy);
                } else {
                    alert('階層情報の取得に失敗しました');
                }
            } catch (error) {
                alert('階層情報の取得でエラーが発生しました: ' + error.message);
            }
        }
    </script>
</body>
</html>
