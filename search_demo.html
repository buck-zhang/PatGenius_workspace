<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatGenius 検索デモ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .search-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .search-form {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search-input {
            flex: 1;
            min-width: 300px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .field-select {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            min-width: 200px;
        }
        
        .search-btn {
            padding: 15px 30px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
        }
        
        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .examples {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .example-btn {
            padding: 10px 15px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 14px;
        }
        
        .example-btn:hover {
            background: #e9ecef;
        }
        
        .results-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .result-count {
            font-size: 1.2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .search-time {
            color: #666;
            font-size: 0.9rem;
        }
        
        .result-item {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: box-shadow 0.2s;
            cursor: pointer;
        }
        
        .result-item:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .result-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .result-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .result-meta span {
            color: #666;
            font-size: 0.9rem;
        }
        
        .result-content {
            color: #555;
            line-height: 1.5;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .stats-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
        
        @media (max-width: 768px) {
            .search-form {
                flex-direction: column;
            }
            
            .search-input, .field-select, .search-btn {
                width: 100%;
            }
            
            .results-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 PatGenius 検索デモ</h1>
            <p>30,002件の日本特許データを高速検索</p>
        </div>
        
        <div class="stats-section">
            <h2>📊 システム統計</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" id="totalDocs">30,002</div>
                    <div class="stat-label">総文書数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">15</div>
                    <div class="stat-label">検索フィールド</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="searchTime">-</div>
                    <div class="stat-label">最新検索時間(ms)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">100%</div>
                    <div class="stat-label">稼働率</div>
                </div>
            </div>
        </div>
        
        <div class="search-section">
            <h2>🔎 特許検索</h2>
            
            <div class="search-form">
                <input type="text" class="search-input" id="searchInput" placeholder="検索キーワードを入力 (例: 画像形成装置)">
                <select class="field-select" id="fieldSelect">
                    <option value="">全フィールド検索</option>
                    <option value="invention_title">発明名称</option>
                    <option value="technical_field">技術分野</option>
                    <option value="abstract">要約</option>
                    <option value="claims">請求項</option>
                    <option value="applicant_name">出願人名</option>
                    <option value="background_art">背景技術</option>
                    <option value="tech_problem">解決課題</option>
                    <option value="tech_solution">解決手段</option>
                    <option value="description">詳細説明</option>
                    <option value="classification_ipc">IPC分類</option>
                    <option value="f_terms">Fターム</option>
                </select>
                <button class="search-btn" onclick="performSearch()">検索</button>
            </div>
            
            <div class="examples">
                <button class="example-btn" onclick="setExample('画像形成装置', 'invention_title')">発明名称: 画像形成装置</button>
                <button class="example-btn" onclick="setExample('電子写真', 'technical_field')">技術分野: 電子写真</button>
                <button class="example-btn" onclick="setExample('バリカン', '')">全文検索: バリカン</button>
                <button class="example-btn" onclick="setExample('現像剤', 'claims')">請求項: 現像剤</button>
                <button class="example-btn" onclick="setExample('トナー', 'abstract')">要約: トナー</button>
                <button class="example-btn" onclick="setExample('センサ', 'description')">詳細説明: センサ</button>
            </div>
        </div>
        
        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <div class="result-count" id="resultCount">検索結果</div>
                <div class="search-time" id="searchTimeDisplay">検索時間: -</div>
            </div>
            <div id="resultsContainer"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        
        // 検索例を設定
        function setExample(query, field) {
            document.getElementById('searchInput').value = query;
            document.getElementById('fieldSelect').value = field;
        }
        
        // エンターキーで検索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
        
        // 検索実行
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const field = document.getElementById('fieldSelect').value;
            
            if (!query) {
                alert('検索キーワードを入力してください');
                return;
            }
            
            const resultsSection = document.getElementById('resultsSection');
            const resultsContainer = document.getElementById('resultsContainer');
            const searchBtn = document.querySelector('.search-btn');
            
            // ローディング表示
            resultsSection.style.display = 'block';
            resultsContainer.innerHTML = '<div class="loading">🔍 検索中...</div>';
            searchBtn.disabled = true;
            searchBtn.textContent = '検索中...';
            
            try {
                const params = new URLSearchParams({
                    q: query,
                    size: 10
                });
                
                if (field) {
                    params.append('field', field);
                }
                
                const startTime = Date.now();
                const response = await fetch(`${API_BASE}/search?${params}`);
                const endTime = Date.now();
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // 結果表示
                displayResults(data, endTime - startTime);
                updateStats(data.took);
                
            } catch (error) {
                console.error('検索エラー:', error);
                resultsContainer.innerHTML = `
                    <div class="error">
                        ❌ 検索エラー: ${error.message}<br>
                        APIサーバーが起動していることを確認してください。
                    </div>
                `;
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = '検索';
            }
        }
        
        // 結果表示
        function displayResults(data, clientTime) {
            const resultsContainer = document.getElementById('resultsContainer');
            const resultCount = document.getElementById('resultCount');
            const searchTimeDisplay = document.getElementById('searchTimeDisplay');
            
            resultCount.textContent = `検索結果: ${data.total.toLocaleString()}件`;
            searchTimeDisplay.textContent = `検索時間: ${data.took}ms (通信: ${clientTime}ms)`;
            
            if (data.hits.length === 0) {
                resultsContainer.innerHTML = '<div class="error">📭 検索結果が見つかりませんでした。</div>';
                return;
            }
            
            const resultsHtml = data.hits.map((hit, index) => `
                <div class="result-item" onclick="showDetail('${hit.document_id}')">
                    <div class="result-title">
                        ${index + 1}. ${hit.invention_title || 'N/A'}
                    </div>
                    <div class="result-meta">
                        <span>📄 ${hit.document_id || 'N/A'}</span>
                        <span>🏢 ${hit.applicant_name || '出願人不明'}</span>
                        <span>👨‍💼 ${hit.inventor_names || '発明者不明'}</span>
                    </div>
                    <div class="result-content">
                        ${hit.technical_field ? `<strong>技術分野:</strong> ${hit.technical_field.substring(0, 200)}...` : ''}
                        ${hit.abstract ? `<br><strong>要約:</strong> ${hit.abstract.substring(0, 300)}...` : ''}
                    </div>
                </div>
            `).join('');
            
            resultsContainer.innerHTML = resultsHtml;
        }
        
        // 統計更新
        function updateStats(searchTime) {
            document.getElementById('searchTime').textContent = searchTime;
        }
        
        // 詳細表示
        async function showDetail(documentId) {
            if (!documentId) return;
            
            try {
                const response = await fetch(`${API_BASE}/document/${documentId}`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const doc = await response.json();
                
                // 新しいウィンドウで詳細表示
                const detailWindow = window.open('', '_blank', 'width=800,height=600,scrollbars=yes');
                detailWindow.document.write(`
                    <html>
                    <head>
                        <title>特許詳細: ${doc.document_id}</title>
                        <meta charset="UTF-8">
                        <style>
                            body { font-family: Arial, sans-serif; padding: 20px; line-height: 1.6; }
                            .header { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
                            .section { margin-bottom: 20px; }
                            .label { font-weight: bold; color: #667eea; }
                        </style>
                    </head>
                    <body>
                        <div class="header">
                            <h1>📄 特許文書詳細</h1>
                            <p><strong>文献番号:</strong> ${doc.document_id || 'N/A'}</p>
                        </div>
                        
                        <div class="section">
                            <div class="label">発明名称:</div>
                            <p>${doc.invention_title || 'N/A'}</p>
                        </div>
                        
                        <div class="section">
                            <div class="label">出願人:</div>
                            <p>${doc.applicant_name || 'N/A'}</p>
                        </div>
                        
                        <div class="section">
                            <div class="label">発明者:</div>
                            <p>${doc.inventor_names || 'N/A'}</p>
                        </div>
                        
                        <div class="section">
                            <div class="label">技術分野:</div>
                            <p>${doc.technical_field || 'N/A'}</p>
                        </div>
                        
                        <div class="section">
                            <div class="label">要約:</div>
                            <p>${doc.abstract || 'N/A'}</p>
                        </div>
                        
                        ${doc.classification_ipc ? `
                        <div class="section">
                            <div class="label">IPC分類:</div>
                            <p>${doc.classification_ipc.join(', ')}</p>
                        </div>
                        ` : ''}
                        
                        <button onclick="window.close()" style="padding: 10px 20px; margin-top: 20px;">閉じる</button>
                    </body>
                    </html>
                `);
                
            } catch (error) {
                alert(`詳細取得エラー: ${error.message}`);
            }
        }
        
        // ページ読み込み時に統計取得
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    console.log('API接続確認OK');
                }
            } catch (error) {
                console.warn('API接続エラー:', error);
            }
        }
        
        // 初期化
        loadStats();
    </script>
</body>
</html>
