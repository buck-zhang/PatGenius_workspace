<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatGenius 検索デモ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .search-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .search-form {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search-input {
            flex: 1;
            min-width: 300px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .field-select {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            min-width: 200px;
        }
        
        .search-btn {
            padding: 15px 30px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
        }
        
        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .examples {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .example-btn {
            padding: 10px 15px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 14px;
        }
        
        .example-btn:hover {
            background: #e9ecef;
        }
        
        .results-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .result-count {
            font-size: 1.2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .search-time {
            color: #666;
            font-size: 0.9rem;
        }
        
        .result-item {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: box-shadow 0.2s;
            cursor: pointer;
        }
        
        .result-item:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .result-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .result-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .result-meta span {
            color: #666;
            font-size: 0.9rem;
        }
        
        .result-content {
            color: #555;
            line-height: 1.5;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .stats-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
        
        @media (max-width: 768px) {
            .search-form {
                flex-direction: column;
            }
            
            .search-input, .field-select, .search-btn {
                width: 100%;
            }
            
            .results-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 PatGenius 検索デモ</h1>
            <p>30,002件の日本特許データを高速検索</p>
        </div>
        
        <div class="stats-section">
            <h2>📊 システム統計</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" id="totalDocs">30,002</div>
                    <div class="stat-label">総文書数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">15</div>
                    <div class="stat-label">検索フィールド</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="searchTime">-</div>
                    <div class="stat-label">最新検索時間(ms)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">100%</div>
                    <div class="stat-label">稼働率</div>
                </div>
            </div>
        </div>
        
        <div class="search-section">
            <h2>🔎 特許検索</h2>
            
            <!-- シンプル検索フォーム -->
            <div class="search-form">
                <input type="text" class="search-input" id="searchInput" placeholder="検索キーワードを入力 (例: 画像形成装置)">
                <select class="field-select" id="fieldSelect">
                    <option value="">全フィールド検索</option>
                    <option value="invention_title">発明名称</option>
                    <option value="technical_field">技術分野</option>
                    <option value="abstract">要約</option>
                    <option value="claims">請求項</option>
                    <option value="applicant_name">出願人名</option>
                    <option value="background_art">背景技術</option>
                    <option value="tech_problem">解決課題</option>
                    <option value="tech_solution">解決手段</option>
                    <option value="description">詳細説明</option>
                    <option value="classification_ipc">IPC分類</option>
                    <option value="f_terms">Fターム</option>
                </select>
                <button class="search-btn" onclick="performSearch()">検索</button>
                <button class="search-btn" onclick="toggleAdvanced()" style="background: #6c757d;">高度検索</button>
            </div>

            <!-- 高度検索フォーム -->
            <div id="advancedSearch" style="display: none; margin-top: 20px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 8px;">
                <h3 style="margin-bottom: 15px;">🔧 高度検索オプション</h3>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">検索タイプ:</label>
                        <select id="queryType" class="field-select" style="width: 100%;">
                            <option value="simple">シンプル検索</option>
                            <option value="proximity">近傍検索</option>
                            <option value="boolean">ブール検索</option>
                            <option value="query_string">クエリ文字列</option>
                            <option value="multi_field">マルチフィールド</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">近傍距離:</label>
                        <input type="number" id="proximityDistance" class="search-input" value="3" min="1" max="100" style="width: 100%;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">必須キーワード (AND):</label>
                        <input type="text" id="mustTerms" class="search-input" placeholder="キーワード1, キーワード2" style="width: 100%;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">オプションキーワード (OR):</label>
                        <input type="text" id="shouldTerms" class="search-input" placeholder="キーワード1, キーワード2" style="width: 100%;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">除外キーワード (NOT):</label>
                        <input type="text" id="mustNotTerms" class="search-input" placeholder="キーワード1, キーワード2" style="width: 100%;">
                    </div>
                </div>

                <button class="search-btn" onclick="performAdvancedSearch()" style="background: #28a745;">高度検索実行</button>
            </div>

            <!-- 検索利用方法 -->
            <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                <h4>📖 検索利用方法</h4>
                <div style="margin-top: 10px; font-size: 14px;">
                    <strong>近傍検索:</strong> "車 near3 両" → 車と両が3語以内の距離で検索<br>
                    <strong>ブール検索:</strong> 必須・オプション・除外キーワードを組み合わせ<br>
                    <strong>クエリ文字列:</strong> "発明名称:トナー AND 技術分野:電子写真"<br>
                    <strong>マルチフィールド:</strong> 複数フィールドに異なるクエリを指定
                </div>
            </div>
        </div>
            
            <div class="examples">
                <h4 style="margin-bottom: 10px;">📝 シンプル検索例</h4>
                <button class="example-btn" onclick="setExample('画像形成装置', 'invention_title')">発明名称: 画像形成装置</button>
                <button class="example-btn" onclick="setExample('電子写真', 'technical_field')">技術分野: 電子写真</button>
                <button class="example-btn" onclick="setExample('バリカン', '')">全文検索: バリカン</button>
                <button class="example-btn" onclick="setExample('現像剤', 'claims')">請求項: 現像剤</button>
                <button class="example-btn" onclick="setExample('トナー', 'abstract')">要約: トナー</button>
                <button class="example-btn" onclick="setExample('センサ', 'description')">詳細説明: センサ</button>
                
                <h4 style="margin: 20px 0 10px 0;">🔧 高度検索例</h4>
                <button class="example-btn" onclick="setAdvancedExample('proximity', '車 near3 両', 'technical_field')" style="background: #e3f2fd;">近傍検索: 車 near3 両</button>
                <button class="example-btn" onclick="setAdvancedExample('boolean', '', '', 'トナー,現像剤', 'プリンター', 'レーザー')" style="background: #f3e5f5;">ブール検索: (トナー OR 現像剤) AND プリンター NOT レーザー</button>
                <button class="example-btn" onclick="setAdvancedExample('query_string', 'invention_title:画像 AND technical_field:電子写真')" style="background: #e8f5e8;">クエリ文字列: フィールド指定AND検索</button>
            </div>
        </div>
        
        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <div class="result-count" id="resultCount">検索結果</div>
                <div class="search-time" id="searchTimeDisplay">検索時間: -</div>
            </div>
            <div id="resultsContainer"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        
        // 検索例を設定
        function setExample(query, field) {
            document.getElementById('searchInput').value = query;
            document.getElementById('fieldSelect').value = field;
        }
        
        // エンターキーで検索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
        
        // 検索実行
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const field = document.getElementById('fieldSelect').value;
            
            if (!query) {
                alert('検索キーワードを入力してください');
                return;
            }
            
            const resultsSection = document.getElementById('resultsSection');
            const resultsContainer = document.getElementById('resultsContainer');
            const searchBtn = document.querySelector('.search-btn');
            
            // ローディング表示
            resultsSection.style.display = 'block';
            resultsContainer.innerHTML = '<div class="loading">🔍 検索中...</div>';
            searchBtn.disabled = true;
            searchBtn.textContent = '検索中...';
            
            try {
                const params = new URLSearchParams({
                    q: query,
                    size: 10
                });
                
                if (field) {
                    params.append('field', field);
                }
                
                const startTime = Date.now();
                const response = await fetch(`${API_BASE}/search?${params}`);
                const endTime = Date.now();
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // 結果表示
                displayResults(data, endTime - startTime);
                updateStats(data.took);
                
            } catch (error) {
                console.error('検索エラー:', error);
                resultsContainer.innerHTML = `
                    <div class="error">
                        ❌ 検索エラー: ${error.message}<br>
                        APIサーバーが起動していることを確認してください。
                    </div>
                `;
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = '検索';
            }
        }
        
        // 結果表示
        function displayResults(data, clientTime) {
            const resultsContainer = document.getElementById('resultsContainer');
            const resultCount = document.getElementById('resultCount');
            const searchTimeDisplay = document.getElementById('searchTimeDisplay');
            
            resultCount.textContent = `検索結果: ${data.total.toLocaleString()}件`;
            searchTimeDisplay.textContent = `検索時間: ${data.took}ms (通信: ${clientTime}ms)`;
            
            if (data.hits.length === 0) {
                resultsContainer.innerHTML = '<div class="error">📭 検索結果が見つかりませんでした。</div>';
                return;
            }
            
            const resultsHtml = data.hits.map((hit, index) => `
                <div class="result-item" onclick="showDetail('${hit.document_id}')">
                    <div class="result-title">
                        ${index + 1}. ${hit.invention_title || 'N/A'}
                    </div>
                    <div class="result-meta">
                        <span>📄 ${hit.document_id || 'N/A'}</span>
                        <span>🏢 ${hit.applicant_name || '出願人不明'}</span>
                        <span>👨‍💼 ${hit.inventor_names || '発明者不明'}</span>
                    </div>
                    <div class="result-content">
                        ${hit.technical_field ? `<strong>技術分野:</strong> ${hit.technical_field.substring(0, 200)}...` : ''}
                        ${hit.abstract ? `<br><strong>要約:</strong> ${hit.abstract.substring(0, 300)}...` : ''}
                    </div>
                </div>
            `).join('');
            
            resultsContainer.innerHTML = resultsHtml;
        }
        
        // 統計更新
        function updateStats(searchTime) {
            document.getElementById('searchTime').textContent = searchTime;
        }
        
        // 詳細表示
        async function showDetail(documentId) {
            if (!documentId) return;
            
            try {
                const response = await fetch(`${API_BASE}/document/${documentId}`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const doc = await response.json();
                
                // 新しいウィンドウで詳細表示
                const detailWindow = window.open('', '_blank', 'width=800,height=600,scrollbars=yes');
                detailWindow.document.write(`
                    <html>
                    <head>
                        <title>特許詳細: ${doc.document_id}</title>
                        <meta charset="UTF-8">
                        <style>
                            body { font-family: Arial, sans-serif; padding: 20px; line-height: 1.6; }
                            .header { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
                            .section { margin-bottom: 20px; }
                            .label { font-weight: bold; color: #667eea; }
                        </style>
                    </head>
                    <body>
                        <div class="header">
                            <h1>📄 特許文書詳細</h1>
                            <p><strong>文献番号:</strong> ${doc.document_id || 'N/A'}</p>
                        </div>
                        
                        <div class="section">
                            <div class="label">発明名称:</div>
                            <p>${doc.invention_title || 'N/A'}</p>
                        </div>
                        
                        <div class="section">
                            <div class="label">出願人:</div>
                            <p>${doc.applicant_name || 'N/A'}</p>
                        </div>
                        
                        <div class="section">
                            <div class="label">発明者:</div>
                            <p>${doc.inventor_names || 'N/A'}</p>
                        </div>
                        
                        <div class="section">
                            <div class="label">技術分野:</div>
                            <p>${doc.technical_field || 'N/A'}</p>
                        </div>
                        
                        <div class="section">
                            <div class="label">要約:</div>
                            <p>${doc.abstract || 'N/A'}</p>
                        </div>
                        
                        ${doc.classification_ipc ? `
                        <div class="section">
                            <div class="label">IPC分類:</div>
                            <p>${doc.classification_ipc.join(', ')}</p>
                        </div>
                        ` : ''}
                        
                        <button onclick="window.close()" style="padding: 10px 20px; margin-top: 20px;">閉じる</button>
                    </body>
                    </html>
                `);
                
            } catch (error) {
                alert(`詳細取得エラー: ${error.message}`);
            }
        }
        
        // ページ読み込み時に統計取得
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    console.log('API接続確認OK');
                }
            } catch (error) {
                console.warn('API接続エラー:', error);
            }
        }

        // 高度検索の表示/非表示切り替え
        function toggleAdvanced() {
            const advancedDiv = document.getElementById('advancedSearch');
            const isVisible = advancedDiv.style.display !== 'none';
            advancedDiv.style.display = isVisible ? 'none' : 'block';
            
            const btn = event.target;
            btn.textContent = isVisible ? '高度検索' : '高度検索を閉じる';
            btn.style.background = isVisible ? '#6c757d' : '#dc3545';
        }

        // 高度検索例の設定
        function setAdvancedExample(queryType, query, field, shouldTerms, mustTerms, mustNotTerms) {
            // 高度検索パネルを表示
            document.getElementById('advancedSearch').style.display = 'block';
            document.querySelector('button[onclick="toggleAdvanced()"]').textContent = '高度検索を閉じる';
            document.querySelector('button[onclick="toggleAdvanced()"]').style.background = '#dc3545';
            
            // 値を設定
            document.getElementById('queryType').value = queryType;
            document.getElementById('searchInput').value = query || '';
            document.getElementById('fieldSelect').value = field || '';
            document.getElementById('shouldTerms').value = shouldTerms || '';
            document.getElementById('mustTerms').value = mustTerms || '';
            document.getElementById('mustNotTerms').value = mustNotTerms || '';
            
            if (queryType === 'proximity') {
                document.getElementById('proximityDistance').value = '3';
            }
        }

        // 高度検索実行
        async function performAdvancedSearch() {
            const queryType = document.getElementById('queryType').value;
            const query = document.getElementById('searchInput').value.trim();
            const field = document.getElementById('fieldSelect').value;
            const proximityDistance = parseInt(document.getElementById('proximityDistance').value) || 3;
            const mustTerms = document.getElementById('mustTerms').value.trim();
            const shouldTerms = document.getElementById('shouldTerms').value.trim();
            const mustNotTerms = document.getElementById('mustNotTerms').value.trim();

            if (!query && !mustTerms && !shouldTerms) {
                alert('検索キーワードまたは条件を入力してください');
                return;
            }

            const resultsSection = document.getElementById('resultsSection');
            const resultsContainer = document.getElementById('resultsContainer');
            const searchBtn = event.target;
            
            // ローディング表示
            resultsSection.style.display = 'block';
            resultsContainer.innerHTML = '<div class="loading">🔍 高度検索中...</div>';
            searchBtn.disabled = true;
            searchBtn.textContent = '検索中...';

            try {
                // 高度検索リクエストボディ構築
                const requestBody = {
                    query_type: queryType,
                    query: query,
                    field: field || null,
                    proximity_distance: proximityDistance,
                    size: 10
                };

                // ブール検索条件の処理
                if (mustTerms) {
                    requestBody.must_terms = mustTerms.split(',').map(term => term.trim()).filter(term => term);
                }
                if (shouldTerms) {
                    requestBody.should_terms = shouldTerms.split(',').map(term => term.trim()).filter(term => term);
                }
                if (mustNotTerms) {
                    requestBody.must_not_terms = mustNotTerms.split(',').map(term => term.trim()).filter(term => term);
                }

                const startTime = Date.now();
                const response = await fetch(`${API_BASE}/search/advanced`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const endTime = Date.now();
                const searchTime = endTime - startTime;

                displayResults(data, searchTime);

            } catch (error) {
                console.error('高度検索エラー:', error);
                resultsContainer.innerHTML = `
                    <div class="error-message">
                        <h3>🚫 検索エラー</h3>
                        <p>高度検索でエラーが発生しました: ${error.message}</p>
                        <p>APIサーバーが起動していることを確認してください。</p>
                    </div>
